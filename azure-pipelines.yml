              APP_KEY: $(APP_KEY)
              STATIC_API_KEY: $(STATIC_API_KEY)
              POSTGRES_USER: $(POSTGRES_USER)
              POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)
              POSTGRES_DB: $(POSTGRES_DB)
              MINIO_ROOT_PASSWORD: $(MINIO_ROOT_PASSWORD)
              MINIO_BACKEND_USER: $(MINIO_BACKEND_USER)
              MINIO_BACKEND_PASSWORD: $(MINIO_BACKEND_PASSWORD)
              REVERB_APP_ID: $(REVERB_APP_ID)
              REVERB_APP_KEY: $(REVERB_APP_KEY)
              REVERB_APP_SECRET: $(REVERB_APP_SECRET)
              AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
              AZURE_OPENAI_KEY: $(AZURE_OPENAI_KEY)
              LLM_MODEL_DEPLOYMENT: $(LLM_MODEL_DEPLOYMENT)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                for v in APP_KEY STATIC_API_KEY POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB REVERB_APP_ID REVERB_APP_KEY REVERB_APP_SECRET; do
                  case "${!v}" in
                    ""|'$('*) echo "##[error]$v is not set in the kdai-secrets variable group"; exit 1 ;;
                  esac
                done
                case "$MINIO_BACKEND_USER" in ""|'$('*) MINIO_BACKEND_USER="kdai-backend" ;; esac
                case "$MINIO_BACKEND_PASSWORD" in ""|'$('*) MINIO_BACKEND_PASSWORD="$MINIO_ROOT_PASSWORD" ;; esac
                # LLM: Azure OpenAI's OpenAI-compatible chat-completions endpoint.
                case "$AZURE_OPENAI_ENDPOINT" in ""|'$('*) AZURE_OPENAI_ENDPOINT="https://oai-kdai-inno-d.openai.azure.com" ;; esac
                case "$AZURE_OPENAI_KEY" in
                  ""|'$('*)
                    echo "##[warning]AZURE_OPENAI_KEY not set — question extraction / AI suggestions will fail auth."
                    AZURE_OPENAI_KEY="not-set" ;;
                esac
                LLM_URL="${AZURE_OPENAI_ENDPOINT%/}/openai/v1/chat/completions"

                ACR_LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
                ENV_DOMAIN=$(az containerapp env show --name "$CONTAINER_APP_ENV" --resource-group "$RESOURCE_GROUP" \
                  --query properties.defaultDomain -o tsv)
                MINIO_FQDN=$(az containerapp show --name "$MINIO_APP" --resource-group "$RESOURCE_GROUP" \
                  --query "properties.configuration.ingress.fqdn" -o tsv)
                [ -n "$MINIO_FQDN" ] || { echo "##[error]MinIO app not found"; exit 1; }
                # Deterministic FQDNs (apps may be created later in this same job):
                NGINX_FQDN="${NGINX_APP}.${ENV_DOMAIN}"
                CSP_FQDN="${CSP_APP}.internal.${ENV_DOMAIN}"
                M3U8_FQDN="${M3U8_APP}.internal.${ENV_DOMAIN}"
                REVERB_FQDN="${REVERB_APP}.internal.${ENV_DOMAIN}"

                # Postgres has no volume, so a fresh postgres revision means an empty
                # database. Roll the backend only once the live postgres revision is really
                # running: the entrypoint migrates exactly once, and if it migrates a replica
                # that is on its way out, the surviving one is left without a schema (the
                # db-guard watchdog in the image repairs that, but a deploy shouldn't need it).
                PG_STATE=""
                for i in $(seq 1 30); do
                  PG_STATE=$(az containerapp revision list --name "$POSTGRES_APP" --resource-group "$RESOURCE_GROUP" \
                    --query "[?properties.active] | sort_by(@, &properties.createdTime) | [-1].properties.runningState" \
                    -o tsv 2>/dev/null || true)
                  if [ "$PG_STATE" = "Running" ]; then break; fi
                  echo "postgres revision is '${PG_STATE:-unknown}' - waiting ($i/30)"
                  sleep 10
                done
                if [ "$PG_STATE" != "Running" ]; then
                  echo "##[warning]postgres never reported Running; the backend may migrate a stale replica (db-guard re-migrates within ~1 min)"
                fi

                ENV_VARS=(
                  "APP_KEY=secretref:app-key"
                  "APP_URL=https://${NGINX_FQDN}"
                  "LOG_CHANNEL=stderr"
                  "DB_CONNECTION=pgsql"
                  "DB_HOST=${POSTGRES_APP}"
                  "DB_PORT=5432"
                  "DB_DATABASE=${POSTGRES_DB}"
                  "DB_USERNAME=${POSTGRES_USER}"
                  "DB_PASSWORD=secretref:db-password"
                  "STATIC_API_KEY=secretref:static-api-key"
                  "MINIO_ENDPOINT=https://${MINIO_FQDN}"
                  "MINIO_ACCESS_KEY=secretref:minio-backend-user"
                  "MINIO_SECRET_KEY=secretref:minio-backend-password"
                  "MINIO_BUCKET=debates"
                  "AWS_ACCESS_KEY_ID=secretref:minio-backend-user"
                  "AWS_SECRET_ACCESS_KEY=secretref:minio-backend-password"
                  "AWS_DEFAULT_REGION=us-east-1"
                  "AWS_BUCKET=debates"
                  "AWS_ENDPOINT=https://${MINIO_FQDN}"
                  "AWS_URL=https://${MINIO_FQDN}/debates"
                  "AWS_USE_PATH_STYLE_ENDPOINT=true"
                  "FILESYSTEM_DISK=s3"
                  "SANCTUM_STATEFUL_DOMAINS=${NGINX_FQDN}"
                  "ATTS_CSP_URL=https://${CSP_FQDN}/health"
                  "ATTS_WHISPERLIVE_URL=http://${WHISPERLIVE_APP}:9090/health"
                  "ATTS_CSP_QUEUE=csp_queue"
                  "ATTS_TS_QUEUE=csp_queue"
                  "ATTS_TFS_QUEUE=tfs_queue"
                  "ATTS_CSP_SEGMENT_COMPLETE_QUEUE=csp_segment_complete"
                  "ATTS_TS_SEGMENT_COMPLETE_QUEUE=ts_segment_complete"
                  "ATTS_TFS_SEGMENT_COMPLETE_QUEUE=tfs_segment_complete"
                  "ATTS_ERROR_NOTIFICATION_QUEUE=error_notification"
                  "LLM_URL=${LLM_URL}"
                  "LLM_MODEL=${LLM_MODEL_DEPLOYMENT}"
                  "LLM_AUTH_KEY=secretref:llm-auth-key"
                  "STREAM_BASE_URL=https://livestreaming.b67buv2.tweedekamer.nl/live"
                  "STREAM_AUDIO_PATH=audio/prog_index.m3u8"
                  "STREAM_EMULATOR_URL=https://${M3U8_FQDN}/hls/stream.m3u8"
                  "M3U8_DOCKER_PORT=2121"
                  "BROADCAST_CONNECTION=reverb"
                  "REVERB_APP_ID=secretref:reverb-app-id"
                  "REVERB_APP_KEY=secretref:reverb-app-key"
                  "REVERB_APP_SECRET=secretref:reverb-app-secret"
                  "REVERB_HOST=${REVERB_FQDN}"
                  "REVERB_PORT=443"
                  "REVERB_SCHEME=https"
                  "REVERB_PATH=/app"
                  "REVERB_SERVER_HOST=0.0.0.0"
                  # broadcasting.php uses REVERB_SERVER_PORT for the server->Reverb POST,
                  # which goes through the Reverb app's internal https ingress (443). The
                  # in-container reverb process then binds :443 too — harmless, unused.
                  "REVERB_SERVER_PORT=443"
                  "REVERB_SERVER_PATH=/app"
                  # Off: the backend's in-container reverb (supervisord) is unused - real
                  # websockets run in the dedicated ca-kdai-reverb app. Scaling ON only makes
                  # this unused server crash-loop on Redis pub/sub (see the Reverb app note).
                  "REVERB_SCALING_ENABLED=false"
                  "REDIS_HOST=${REDIS_APP}"
                  "REDIS_PORT=6379"
                  "REDIS_CLIENT=predis"
                )
                SECRETS=(
                  "app-key=${APP_KEY}"
                  "db-password=${POSTGRES_PASSWORD}"
                  "static-api-key=${STATIC_API_KEY}"
                  "minio-backend-user=${MINIO_BACKEND_USER}"
                  "minio-backend-password=${MINIO_BACKEND_PASSWORD}"
                  "llm-auth-key=${AZURE_OPENAI_KEY}"
                  "reverb-app-id=${REVERB_APP_ID}"
                  "reverb-app-key=${REVERB_APP_KEY}"
                  "reverb-app-secret=${REVERB_APP_SECRET}"
                )

                if az containerapp show --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
                  az containerapp secret set \
                    --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" --secrets "${SECRETS[@]}"
                  az containerapp registry set \
                    --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" \
                    --server "$ACR_LOGIN_SERVER" --identity system
                  # php-fpm speaks fastcgi: plain TCP ingress, reachable as <app>:9000
                  az containerapp ingress enable \
                    --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" \
                    --type internal --transport tcp --target-port 9000 --exposed-port 9000
                  az containerapp update \
                    --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" \
                    --image "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:$IMAGE_TAG" \
                    --set-env-vars "${ENV_VARS[@]}"
                else
                  az containerapp create \
                    --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" \
                    --environment "$CONTAINER_APP_ENV" \
                    --image "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:$IMAGE_TAG" \
                    --registry-server "$ACR_LOGIN_SERVER" --registry-identity system \
                    --ingress internal --transport tcp --target-port 9000 --exposed-port 9000 \
                    --secrets "${SECRETS[@]}" \
                    --env-vars "${ENV_VARS[@]}" \
                    --cpu 1.0 --memory 2.0Gi \
                    --min-replicas 1 --max-replicas 1
                fi

                # Single-revision mode fails quietly: when the new revision never becomes
                # healthy, Container Apps keeps 100% of traffic on the previous one and the
                # deploy still reports success - including the migrate/seed this build ships.
                LATEST_REV=$(az containerapp show --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" \
                  --query properties.latestRevisionName -o tsv)
                REV_STATE=""
                for i in $(seq 1 30); do
                  REV_STATE=$(az containerapp revision show --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" \
                    --revision "$LATEST_REV" --query properties.runningState -o tsv 2>/dev/null || true)
                  case "$REV_STATE" in
                    Running|Failed|Degraded) break ;;
                  esac
                  echo "backend revision $LATEST_REV is '${REV_STATE:-unknown}' - waiting ($i/30)"
                  sleep 10
                done
                echo "backend revision $LATEST_REV: ${REV_STATE:-unknown}"
                if [ "$REV_STATE" != "Running" ]; then
                  echo "##[warning]backend revision $LATEST_REV is '${REV_STATE:-unknown}' - traffic may still be served by the previous revision, so this build's migrations never ran"
                fi

          - task: AzureCLI@2
            displayName: Deploy nginx front door (public entrypoint)
            env:
              IMAGE_TAG: $(Build.BuildId)
              NGINX_APP: $(NGINX_APP)
              NGINX_IMAGE: $(NGINX_IMAGE)
              BACKEND_APP: $(BACKEND_APP)
              FRONTEND_APP: $(FRONTEND_APP)
              REVERB_APP: $(REVERB_APP)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              CONTAINER_APP_ENV: $(CONTAINER_APP_ENV)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                ACR_LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
                ENV_DOMAIN=$(az containerapp env show --name "$CONTAINER_APP_ENV" --resource-group "$RESOURCE_GROUP" \
                  --query properties.defaultDomain -o tsv)

                ENV_VARS=(
                  "BACKEND_FASTCGI=${BACKEND_APP}:9000"
                  "REVERB_UPSTREAM=https://${REVERB_APP}.internal.${ENV_DOMAIN}"
                  "FRONTEND_UPSTREAM=https://${FRONTEND_APP}.internal.${ENV_DOMAIN}"
                )

                if az containerapp show --name "$NGINX_APP" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
                  az containerapp registry set \
                    --name "$NGINX_APP" --resource-group "$RESOURCE_GROUP" \
                    --server "$ACR_LOGIN_SERVER" --identity system
                  az containerapp ingress enable \
                    --name "$NGINX_APP" --resource-group "$RESOURCE_GROUP" \
                    --type external --target-port 80 --transport auto
                  az containerapp update \
                    --name "$NGINX_APP" --resource-group "$RESOURCE_GROUP" \
                    --image "$ACR_LOGIN_SERVER/$NGINX_IMAGE:$IMAGE_TAG" \
                    --set-env-vars "${ENV_VARS[@]}"
                else
                  az containerapp create \
                    --name "$NGINX_APP" --resource-group "$RESOURCE_GROUP" \
                    --environment "$CONTAINER_APP_ENV" \
                    --image "$ACR_LOGIN_SERVER/$NGINX_IMAGE:$IMAGE_TAG" \
                    --registry-server "$ACR_LOGIN_SERVER" --registry-identity system \
                    --ingress external --target-port 80 --transport auto \
                    --env-vars "${ENV_VARS[@]}" \
                    --cpu 0.25 --memory 0.5Gi \
                    --min-replicas 1 --max-replicas 1
                fi

                FQDN=$(az containerapp show --name "$NGINX_APP" --resource-group "$RESOURCE_GROUP" \
                  --query "properties.configuration.ingress.fqdn" -o tsv)
                echo "=========================================="
                echo "  KDAI is live at: https://${FQDN}"
                echo "=========================================="
