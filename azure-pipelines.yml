trigger:
  branches:
    include:
      - main

# GitHub service connection must be created in Azure DevOps:
# Project Settings → Service connections → New → GitHub → name it "github-kdai"
resources:
  repositories:
    - repository: KDAI-backend
      type: github
      name: W-KDAI/KDAI-backend
      ref: refs/heads/main
      endpoint: github-kdai
    - repository: KDAI-frontend
      type: github
      name: W-KDAI/KDAI-frontend
      ref: refs/heads/main
      endpoint: github-kdai

pool:
  name: alz-p-mgmt-we-ccoe-pool

variables:
  - group: kdai-secrets
  - name: BACKEND_IMAGE
    value: kdai-backend
  - name: FRONTEND_IMAGE
    value: kdai-frontend
  - name: RESOURCE_GROUP
    value: rg-kdai-inno-d
  - name: CONTAINER_APP_ENV
    value: cae-kdai-inno-d
  - name: BACKEND_APP
    value: ca-kdai-backend-inno-d
  - name: FRONTEND_APP
    value: ca-kdai-frontend-inno-d
  - name: POSTGRES_APP
    value: ca-kdai-postgres-inno-d
  - name: MINIO_APP
    value: ca-kdai-minio-inno-d


stages:
  - stage: Build
    displayName: Build and push images
    jobs:
      - job: Build
        displayName: Docker build and push to ACR
        steps:
          - checkout: self
          - checkout: KDAI-backend
          - checkout: KDAI-frontend

          - task: AzureCLI@2
            displayName: Build and push backend
            env:
              IMAGE_TAG: $(Build.BuildId)
              BACKEND_IMAGE: $(BACKEND_IMAGE)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                # HOTFIX: The KDAI-backend Dockerfile runs `php artisan key:generate` during the
                # image build, but does not ensure a .env file exists beforehand. Laravel's
                # key:generate command requires an existing .env file to write the APP_KEY into,
                # so the build fails with "Failed to open stream: No such file or directory".
                #
                # The permanent fix is to add `RUN cp .env.example .env` (or `RUN touch .env`)
                # to the KDAI-backend Dockerfile before the key:generate step. Until that change
                # is made upstream, we create a minimal placeholder .env here so the file exists
                # in the Docker build context when the COPY step runs.
                #
                # The APP_KEY written here is a temporary value; the real key must be injected
                # at runtime via the Container App environment variable, which overrides the
                # value baked into the image.
                echo "APP_KEY=" > "$(Build.SourcesDirectory)/KDAI-backend/.env"

                ACR_LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
                az acr login --name "${ACR_LOGIN_SERVER%%.*}"
                docker build \
                  -t "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:$IMAGE_TAG" \
                  -t "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:latest" \
                  $(Build.SourcesDirectory)/KDAI-backend
                docker push "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:$IMAGE_TAG"
                docker push "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:latest"

          - task: AzureCLI@2
            displayName: Build and push frontend
            env:
              IMAGE_TAG: $(Build.BuildId)
              FRONTEND_IMAGE: $(FRONTEND_IMAGE)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              CONTAINER_APP_ENV: $(CONTAINER_APP_ENV)
              BACKEND_APP: $(BACKEND_APP)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                ACR_LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
                az acr login --name "${ACR_LOGIN_SERVER%%.*}"

                # Inject the API base URL at build time WITHOUT modifying the frontend repo.
                # Vite bakes VITE_* vars into the bundle during `npm run build`, and the
                # Dockerfile's `COPY . .` picks up this .env (which is git-ignored, so the repo
                # is untouched). The SPA calls the backend's public ingress directly; the backend
                # is exposed externally in the Deploy stage. Its external FQDN is deterministic:
                # <app>.<env-default-domain>.
                ENV_DOMAIN=$(az containerapp env show --name "$CONTAINER_APP_ENV" --resource-group "$RESOURCE_GROUP" --query properties.defaultDomain -o tsv)
                [ -n "$ENV_DOMAIN" ] || { echo "##[error]Could not resolve default domain for Container Apps env $CONTAINER_APP_ENV"; exit 1; }
                echo "VITE_API_BASE_URL=https://${BACKEND_APP}.${ENV_DOMAIN}/api" > "$(Build.SourcesDirectory)/KDAI-frontend/.env"

                docker build \
                  -t "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:$IMAGE_TAG" \
                  -t "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:latest" \
                  $(Build.SourcesDirectory)/KDAI-frontend
                docker push "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:$IMAGE_TAG"
                docker push "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:latest"

  - stage: Deploy
    displayName: Deploy to Container Apps
    dependsOn: Build
    jobs:
      - job: Deploy
        displayName: Deploy all services
        steps:
          # Deploy postgres first so its FQDN is available for the backend
          - task: AzureCLI@2
            displayName: Deploy postgres
            env:
              POSTGRES_APP: $(POSTGRES_APP)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              CONTAINER_APP_ENV: $(CONTAINER_APP_ENV)
              POSTGRES_USER: $(POSTGRES_USER)
              POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)
              POSTGRES_DB: $(POSTGRES_DB)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                for v in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB; do
                  case "${!v}" in
                    ""|'$('*) echo "##[error]$v is not set in the kdai-secrets variable group"; exit 1 ;;
                  esac
                done
                if az containerapp show --name "$POSTGRES_APP" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
                  az containerapp secret set \
                    --name "$POSTGRES_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --secrets \
                      "postgres-user=${POSTGRES_USER}" \
                      "postgres-password=${POSTGRES_PASSWORD}" \
                      "postgres-db=${POSTGRES_DB}"
                  az containerapp update \
                    --name "$POSTGRES_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --set-env-vars \
                      "POSTGRES_USER=secretref:postgres-user" \
                      "POSTGRES_PASSWORD=secretref:postgres-password" \
                      "POSTGRES_DB=secretref:postgres-db"
                else
                  az containerapp create \
                    --name "$POSTGRES_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --environment "$CONTAINER_APP_ENV" \
                    --image "postgres:16" \
                    --ingress internal \
                    --target-port 5432 \
                    --transport tcp \
                    --env-vars \
                      "POSTGRES_USER=secretref:postgres-user" \
                      "POSTGRES_PASSWORD=secretref:postgres-password" \
                      "POSTGRES_DB=secretref:postgres-db" \
                    --secrets \
                      "postgres-user=${POSTGRES_USER}" \
                      "postgres-password=${POSTGRES_PASSWORD}" \
                      "postgres-db=${POSTGRES_DB}" \
                    --cpu 0.5 --memory 1.0Gi \
                    --min-replicas 1 --max-replicas 1
                fi

          - task: AzureCLI@2
            displayName: Deploy minio
            env:
              MINIO_APP: $(MINIO_APP)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              CONTAINER_APP_ENV: $(CONTAINER_APP_ENV)
              MINIO_ROOT_USER: $(MINIO_ROOT_USER)
              MINIO_ROOT_PASSWORD: $(MINIO_ROOT_PASSWORD)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                for v in MINIO_ROOT_USER MINIO_ROOT_PASSWORD; do
                  case "${!v}" in
                    ""|'$('*) echo "##[error]$v is not set in the kdai-secrets variable group"; exit 1 ;;
                  esac
                done
                if az containerapp show --name "$MINIO_APP" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
                  az containerapp secret set \
                    --name "$MINIO_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --secrets \
                      "minio-root-user=${MINIO_ROOT_USER}" \
                      "minio-root-password=${MINIO_ROOT_PASSWORD}"
                  az containerapp update \
                    --name "$MINIO_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --set-env-vars \
                      "MINIO_ROOT_USER=secretref:minio-root-user" \
                      "MINIO_ROOT_PASSWORD=secretref:minio-root-password" \
                      "MINIO_CONSOLE_ADDRESS=:9001"
                else
                  az containerapp create \
                    --name "$MINIO_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --environment "$CONTAINER_APP_ENV" \
                    --image "minio/minio:latest" \
                    --ingress internal \
                    --target-port 9000 \
                    --env-vars \
                      "MINIO_ROOT_USER=secretref:minio-root-user" \
                      "MINIO_ROOT_PASSWORD=secretref:minio-root-password" \
                      "MINIO_CONSOLE_ADDRESS=:9001" \
                    --secrets \
                      "minio-root-user=${MINIO_ROOT_USER}" \
                      "minio-root-password=${MINIO_ROOT_PASSWORD}" \
                    --command "minio" \
                    --args "server" "/data" \
                    --cpu 0.5 --memory 1.0Gi \
                    --min-replicas 1 --max-replicas 1
                fi

                # The containerapp CLI extension can print an error yet exit 0, leaving the
                # step green without creating anything. Assert the app actually exists.
                az containerapp show --name "$MINIO_APP" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1 \
                  || { echo "##[error]Minio app '$MINIO_APP' does not exist after the deploy step — see the 'az containerapp create' output above for the real failure."; exit 1; }

          - task: AzureCLI@2
            displayName: Deploy backend
            env:
              IMAGE_TAG: $(Build.BuildId)
              BACKEND_IMAGE: $(BACKEND_IMAGE)
              BACKEND_APP: $(BACKEND_APP)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              CONTAINER_APP_ENV: $(CONTAINER_APP_ENV)
              POSTGRES_APP: $(POSTGRES_APP)
              MINIO_APP: $(MINIO_APP)
              POSTGRES_USER: $(POSTGRES_USER)
              POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)
              POSTGRES_DB: $(POSTGRES_DB)
              MINIO_ROOT_USER: $(MINIO_ROOT_USER)
              MINIO_ROOT_PASSWORD: $(MINIO_ROOT_PASSWORD)
              APP_KEY: $(APP_KEY)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                ACR_LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
                [ -n "$ACR_LOGIN_SERVER" ] || { echo "##[error]No ACR found in resource group $RESOURCE_GROUP"; exit 1; }
                case "$APP_KEY" in
                  ""|'$('*) echo "##[error]APP_KEY is not set in the kdai-secrets variable group"; exit 1 ;;
                esac

                POSTGRES_FQDN=$(az containerapp show \
                  --name "$POSTGRES_APP" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "properties.configuration.ingress.fqdn" -o tsv)
                MINIO_FQDN=$(az containerapp show \
                  --name "$MINIO_APP" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "properties.configuration.ingress.fqdn" -o tsv)

                [ -n "$POSTGRES_FQDN" ] || { echo "##[error]Postgres app '$POSTGRES_APP' not found — its deploy step must succeed first."; exit 1; }
                [ -n "$MINIO_FQDN" ] || { echo "##[error]Minio app '$MINIO_APP' not found — its deploy step must succeed first."; exit 1; }

                DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_FQDN}:5432/${POSTGRES_DB}"

                if az containerapp show --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
                  az containerapp secret set \
                    --name "$BACKEND_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --secrets \
                      "database-url=${DATABASE_URL}" \
                      "minio-root-user=${MINIO_ROOT_USER}" \
                      "minio-root-password=${MINIO_ROOT_PASSWORD}" \
                      "app-key=${APP_KEY}"
                  az containerapp registry set \
                    --name "$BACKEND_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --server "$ACR_LOGIN_SERVER" \
                    --identity system
                  az containerapp ingress enable \
                    --name "$BACKEND_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --type external \
                    --target-port 8000 \
                    --transport auto
                  az containerapp update \
                    --name "$BACKEND_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --image "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:$IMAGE_TAG" \
                    --min-replicas 1 \
                    --set-env-vars \
                      "DATABASE_URL=secretref:database-url" \
                      "MINIO_ENDPOINT=https://${MINIO_FQDN}" \
                      "MINIO_ROOT_USER=secretref:minio-root-user" \
                      "MINIO_ROOT_PASSWORD=secretref:minio-root-password" \
                      "APP_KEY=secretref:app-key"
                else
                  az containerapp create \
                    --name "$BACKEND_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --environment "$CONTAINER_APP_ENV" \
                    --image "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:$IMAGE_TAG" \
                    --registry-server "$ACR_LOGIN_SERVER" \
                    --registry-identity system \
                    --ingress external \
                    --target-port 8000 \
                    --env-vars \
                      "DATABASE_URL=secretref:database-url" \
                      "MINIO_ENDPOINT=https://${MINIO_FQDN}" \
                      "MINIO_ROOT_USER=secretref:minio-root-user" \
                      "MINIO_ROOT_PASSWORD=secretref:minio-root-password" \
                      "APP_KEY=secretref:app-key" \
                    --secrets \
                      "database-url=${DATABASE_URL}" \
                      "minio-root-user=${MINIO_ROOT_USER}" \
                      "minio-root-password=${MINIO_ROOT_PASSWORD}" \
                      "app-key=${APP_KEY}" \
                    --cpu 0.5 --memory 1.0Gi \
                    --min-replicas 1 --max-replicas 3
                fi

          - task: AzureCLI@2
            displayName: Deploy frontend
            env:
              IMAGE_TAG: $(Build.BuildId)
              FRONTEND_IMAGE: $(FRONTEND_IMAGE)
              FRONTEND_APP: $(FRONTEND_APP)
              BACKEND_APP: $(BACKEND_APP)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              CONTAINER_APP_ENV: $(CONTAINER_APP_ENV)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                ACR_LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
                [ -n "$ACR_LOGIN_SERVER" ] || { echo "##[error]No ACR found in resource group $RESOURCE_GROUP"; exit 1; }

                BACKEND_FQDN=$(az containerapp show \
                  --name "$BACKEND_APP" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "properties.configuration.ingress.fqdn" -o tsv)
                [ -n "$BACKEND_FQDN" ] || { echo "##[error]Backend app '$BACKEND_APP' not found — its deploy step must succeed first."; exit 1; }
                BACKEND_URL="https://${BACKEND_FQDN}"

                if az containerapp show --name "$FRONTEND_APP" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
                  az containerapp registry set \
                    --name "$FRONTEND_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --server "$ACR_LOGIN_SERVER" \
                    --identity system
                  az containerapp ingress update \
                    --name "$FRONTEND_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --target-port 5173
                  az containerapp update \
                    --name "$FRONTEND_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --image "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:$IMAGE_TAG" \
                    --min-replicas 1 \
                    --set-env-vars "BACKEND_URL=${BACKEND_URL}"
                else
                  az containerapp create \
                    --name "$FRONTEND_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --environment "$CONTAINER_APP_ENV" \
                    --image "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:$IMAGE_TAG" \
                    --registry-server "$ACR_LOGIN_SERVER" \
                    --registry-identity system \
                    --ingress external \
                    --target-port 5173 \
                    --env-vars "BACKEND_URL=${BACKEND_URL}" \
                    --cpu 0.25 --memory 0.5Gi \
                    --min-replicas 1 --max-replicas 3
                fi
