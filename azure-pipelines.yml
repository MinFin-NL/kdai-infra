          - task: AzureCLI@2
            displayName: Deploy Reverb (websocket server)
            env:
              IMAGE_TAG: $(Build.BuildId)
              REVERB_APP: $(REVERB_APP)
              REVERB_IMAGE: $(REVERB_IMAGE)
              NGINX_APP: $(NGINX_APP)
              REDIS_APP: $(REDIS_APP)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              CONTAINER_APP_ENV: $(CONTAINER_APP_ENV)
              APP_KEY: $(APP_KEY)
              REVERB_APP_ID: $(REVERB_APP_ID)
              REVERB_APP_KEY: $(REVERB_APP_KEY)
              REVERB_APP_SECRET: $(REVERB_APP_SECRET)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                for v in APP_KEY REVERB_APP_ID REVERB_APP_KEY REVERB_APP_SECRET; do
                  case "${!v}" in
                    ""|'$('*) echo "##[error]$v is not set in the kdai-secrets variable group"; exit 1 ;;
                  esac
                done
                ACR_LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
                ENV_DOMAIN=$(az containerapp env show --name "$CONTAINER_APP_ENV" --resource-group "$RESOURCE_GROUP" \
                  --query properties.defaultDomain -o tsv)
                NGINX_FQDN="${NGINX_APP}.${ENV_DOMAIN}"

                ENV_VARS=(
                  "APP_KEY=secretref:app-key"
                  "APP_URL=https://${NGINX_FQDN}"
                  "LOG_CHANNEL=stderr"
                  "BROADCAST_CONNECTION=reverb"
                  "REVERB_APP_ID=secretref:reverb-app-id"
                  "REVERB_APP_KEY=secretref:reverb-app-key"
                  "REVERB_APP_SECRET=secretref:reverb-app-secret"
                  "REVERB_SERVER_HOST=0.0.0.0"
                  "REVERB_SERVER_PORT=8081"
                  "REVERB_SERVER_PATH=/app"
                  # Keep scaling OFF for this single-replica Reverb app (min=max=1). With it
                  # ON, Reverb opens a Redis pub/sub subscriber; on the CAE's intermittent
                  # ca-kdai-redis-inno-d DNS/NXDOMAIN blips it throws RedisConnectionException
                  # after retrying 60s and the whole websocket server EXITS - so live
                  # transcript segments never reach the browser even though CSP + the ATTS
                  # listener are producing them fine. A single instance needs no Redis fan-out.
                  "REVERB_SCALING_ENABLED=false"
                  # Reverb only touches the cache for its `reverb:restart` signal. With no
                  # CACHE_STORE the reverb image defaults to the DATABASE (sqlite) store and
                  # crashes at boot ("database.sqlite does not exist") - this app has no DB.
                  # A single in-memory instance needs none: use the array store.
                  "CACHE_STORE=array"
                  "REDIS_HOST=${REDIS_APP}"
                  "REDIS_PORT=6379"
                  "REDIS_CLIENT=predis"
                )
                SECRETS=(
                  "app-key=${APP_KEY}"
                  "reverb-app-id=${REVERB_APP_ID}"
                  "reverb-app-key=${REVERB_APP_KEY}"
                  "reverb-app-secret=${REVERB_APP_SECRET}"
                )

                if az containerapp show --name "$REVERB_APP" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
                  az containerapp secret set \
                    --name "$REVERB_APP" --resource-group "$RESOURCE_GROUP" --secrets "${SECRETS[@]}"
                  az containerapp registry set \
                    --name "$REVERB_APP" --resource-group "$RESOURCE_GROUP" \
                    --server "$ACR_LOGIN_SERVER" --identity system
                  az containerapp ingress enable \
                    --name "$REVERB_APP" --resource-group "$RESOURCE_GROUP" \
                    --type internal --target-port 8081 --transport auto
                  az containerapp update \
                    --name "$REVERB_APP" --resource-group "$RESOURCE_GROUP" \
                    --image "$ACR_LOGIN_SERVER/$REVERB_IMAGE:$IMAGE_TAG" \
                    --set-env-vars "${ENV_VARS[@]}"
                else
                  az containerapp create \
                    --name "$REVERB_APP" --resource-group "$RESOURCE_GROUP" \
                    --environment "$CONTAINER_APP_ENV" \
                    --image "$ACR_LOGIN_SERVER/$REVERB_IMAGE:$IMAGE_TAG" \
                    --registry-server "$ACR_LOGIN_SERVER" --registry-identity system \
                    --ingress internal --target-port 8081 --transport auto \
                    --secrets "${SECRETS[@]}" \
                    --env-vars "${ENV_VARS[@]}" \
                    --cpu 0.5 --memory 1.0Gi \
                    --min-replicas 1 --max-replicas 1
                fi

