trigger:
  branches:
    include:
      - main

# GitHub service connection must exist in Azure DevOps:
# Project Settings → Service connections → GitHub → "github-kdai"
resources:
  repositories:
    - repository: kdai3
      type: github
      name: W-KDAI/kdai3
      ref: refs/heads/master
      endpoint: github-kdai

pool:
  name: alz-p-mgmt-we-ccoe-pool

variables:
  - group: kdai-secrets
  - name: RESOURCE_GROUP
    value: rg-kdai-inno-d
  - name: CONTAINER_APP_ENV
    value: cae-kdai-inno-d
  # --- images ---
  - name: BACKEND_IMAGE
    value: kdai-backend
  - name: REVERB_IMAGE
    value: kdai-reverb
  - name: FRONTEND_IMAGE
    value: kdai-frontend
  - name: NGINX_IMAGE
    value: kdai-nginx
  - name: CSP_IMAGE
    value: kdai-atts-csp
  - name: WHISPERLIVE_IMAGE
    value: kdai-whisperlive
  - name: M3U8_IMAGE
    value: kdai-m3u8-emulator
  - name: MINIO_INIT_IMAGE
    value: kdai-minio-init
  # --- container apps ---
  - name: POSTGRES_APP
    value: ca-kdai-postgres-inno-d
  - name: MINIO_APP
    value: ca-kdai-minio-inno-d
  - name: MINIO_INIT_JOB
    value: ca-kdai-minio-init
  - name: REDIS_APP
    value: ca-kdai-redis-inno-d
  - name: WHISPERLIVE_APP
    value: ca-kdai-whisperlive-inno-d
  - name: CSP_APP
    value: ca-kdai-atts-csp-inno-d
  - name: M3U8_APP
    value: ca-kdai-m3u8-emulator-inno-d
  - name: BACKEND_APP
    value: ca-kdai-backend-inno-d
  - name: FRONTEND_APP
    value: ca-kdai-frontend-inno-d
  - name: REVERB_APP
    value: ca-kdai-reverb-inno-d
  - name: NGINX_APP
    value: ca-kdai-nginx-inno-d
  # Azure OpenAI chat deployment used as the LLM (questions/answer-suggestions).
  # Kept in lockstep with the invulhulp app; lives on oai-kdai-inno-d.
  - name: LLM_MODEL_DEPLOYMENT
    value: gpt-5.3-chat

stages:
  - stage: Build
    displayName: Build and push images
    jobs:
      - job: Build
        displayName: Docker build and push to ACR
        steps:
          - checkout: self
          - checkout: kdai3

          - task: AzureCLI@2
            displayName: Build and push backend (+ reverb variant)
            env:
              IMAGE_TAG: $(Build.BuildId)
              BACKEND_IMAGE: $(BACKEND_IMAGE)
              REVERB_IMAGE: $(REVERB_IMAGE)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              GITHUB_TOKEN: $(GITHUB_TOKEN)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                SRC="$(Build.SourcesDirectory)/kdai3/backend"
                [ -d "$SRC" ] || { echo "##[error]kdai3/backend not found in checkout"; exit 1; }

                # PIPELINE PATCH (app repo is read-only): the QES jobs send the LLM key as
                # 'Authorization: Token <key>' (VLAM convention). Azure OpenAI's
                # OpenAI-compatible endpoint requires 'Bearer'. Idempotent sed.
                # (AnswerSuggestionService already uses Bearer upstream.)
                for f in ProcessQuestionExtractionJob EscalateQuestionExtractionJob; do
                  QES_JOB="$SRC/app/Jobs/$f.php"
                  if [ -f "$QES_JOB" ]; then
                    sed -i "s/'Token '\./'Bearer './" "$QES_JOB"
                  else
                    echo "##[warning]$f.php not found; skipped Bearer patch"
                  fi
                done

                # PIPELINE PATCH (app repo is read-only): the reasoning-era Azure OpenAI
                # deployment (gpt-5.3-chat) rejects an explicit `temperature`:
                #   400 unsupported_value - "Unsupported value: 'temperature' does not
                #   support 0 with this model. Only the default (1) value is supported."
                # VLAM accepted temperature 0/0.1, so kdai3 sends it on every LLM call and
                # every QES extraction 400s -> the job burns its 3 tries and no question is
                # ever created, leaving the QES screen permanently empty while the
                # transcription screen looks fine. Drop the parameter entirely (rather than
                # pinning it to 1) so this survives deployments that reject the key itself.
                # Idempotent: the line is gone after the first pass.
                for rel in app/Jobs/ProcessQuestionExtractionJob.php \
                           app/Jobs/EscalateQuestionExtractionJob.php \
                           app/Services/AnswerSuggestionService.php; do
                  LLM_CALLER="$SRC/$rel"
                  if [ -f "$LLM_CALLER" ]; then
                    sed -i "/^ *'temperature' => [0-9.]\+,/d" "$LLM_CALLER"
                    if grep -q "'temperature' =>" "$LLM_CALLER"; then
                      echo "##[error]$rel still sends 'temperature' after patch; Azure OpenAI will 400"
                      exit 1
                    fi
                  else
                    echo "##[warning]$rel not found; skipped temperature patch"
                  fi
                done

                # PIPELINE PATCH (app repo is read-only): raise the emulation-upload cap
                # from 100MB to 2GB. Three idempotent backend gates:
                #  - php-fpm post_max_size / upload_max_filesize (the fpm pool config,
                #    COPYed to www.conf in the backend Dockerfile), plus a generous
                #    max_execution_time so storing a 2GB file to MinIO doesn't abort.
                #  - Laravel's file "max" rule (kilobytes) on uploadEmulationFile.
                #  - the Dutch over-limit message shown to the user.
                PHPFPM="$SRC/php-fpm.conf"
                if [ -f "$PHPFPM" ]; then
                  sed -i 's/^php_value\[post_max_size\] = .*/php_value[post_max_size] = 2048M/' "$PHPFPM"
                  sed -i 's/^php_value\[upload_max_filesize\] = .*/php_value[upload_max_filesize] = 2048M/' "$PHPFPM"
                  # The upstream php-fpm.conf's last line has NO trailing newline, so a
                  # bare `printf >>` concatenates onto it, producing a malformed
                  # `...= 2048Mphp_value[max_execution_time] = 600` directive. php-fpm then
                  # fails to parse www.conf ("unexpected '='", exit 78) and the whole
                  # backend revision goes ActivationFailed - traffic silently stays on the
                  # previous revision (old 100MB cap -> large uploads 502 "broken pipe").
                  # Guarantee a trailing newline before appending (idempotent).
                  [ -n "$(tail -c1 "$PHPFPM")" ] && printf '\n' >> "$PHPFPM"
                  if grep -q 'php_value\[max_execution_time\]' "$PHPFPM"; then
                    sed -i 's/^php_value\[max_execution_time\] = .*/php_value[max_execution_time] = 600/' "$PHPFPM"
                  else
                    printf 'php_value[max_execution_time] = 600\n' >> "$PHPFPM"
                  fi
                else
                  echo "##[warning]php-fpm.conf not found; skipped upload-size patch"
                fi

                DEBATE_CTRL="$SRC/app/Http/Controllers/DebateControllers/DebateController.php"
                if [ -f "$DEBATE_CTRL" ]; then
                  # 2GB in KB (2*1024*1024) for Laravel's file "max" rule.
                  sed -i 's/|max:102400|/|max:2097152|/' "$DEBATE_CTRL"
                  sed -i 's/Bestand mag maximaal 100MB zijn!/Bestand mag maximaal 2GB zijn!/' "$DEBATE_CTRL"
                else
                  echo "##[warning]DebateController.php not found; skipped upload-size patch"
                fi

                # PIPELINE PATCH (app repo is read-only): pin the PHP base image. The floating
                # `php:8.4-fpm` tag moved 8.4.24 -> 8.4.25 on the 2026-09-16 rebuild (same kdai3
                # and infra commits as the working 2026-08-17 build), and after that every /api/
                # request 502'd: nginx gets "Connection reset by peer" from the fastcgi TCP
                # ingress even though php-fpm logs the request as completed. Rolled back to the
                # last known-good version while that is investigated. The PHP pin alone did NOT
                # fix it (nginx was pinned too, see pipeline-overrides/nginx/Dockerfile); keep
                # it until the real cause is known. Idempotent; hard-fails if
                # upstream changes its FROM line so the pin can't lapse silently.
                PHP_BASE="php:8.4.24-fpm"
                sed -i "s#^FROM php:8\.4-fpm\$#FROM $PHP_BASE#" "$SRC/Dockerfile"
                if ! grep -qx "FROM $PHP_BASE" "$SRC/Dockerfile"; then
                  echo "##[error]backend Dockerfile base not pinned to $PHP_BASE (upstream FROM changed?)"
                  exit 1
                fi

                # PIPELINE PATCH (app repo is read-only): self-healing database guard.
                # Postgres has no volume, so every Azure-initiated replica move hands the
                # app an EMPTY database. The backend replica is recreated in the same
                # moment and its entrypoint migrates while DNS still points at the
                # OUTGOING postgres replica: the schema lands on a container that is killed
                # seconds later, and the live, empty postgres never gets one. The entrypoint
                # runs only once, so the app stays broken until someone restarts the backend
                # (2026-09-18/19: `SQLSTATE[42P01] relation "cache" does not exist` on every
                # request, the supervisord `queue` program crash-looping ~1/s, login 500) -
                # and the read-only dev account cannot restart anything. Ship a watchdog in
                # the image instead: it re-runs migrate (+ seed, only when the DB is really
                # empty) as soon as the core tables disappear. Rewritten every build, so
                # idempotent.
                cat > "$SRC/db-guard.php" <<'PHPGUARD'
                <?php
                // Generated by kdai-infra/azure-pipelines.yml - do not edit in the app repo.
                // check      : exit 0 = core tables present, 1 = reachable but schema gone, 2 = unreachable
                // needs-seed : exit 0 = users table is empty (seed required), 1 = otherwise
                $mode = $argv[1] ?? 'check';
                $core = ['migrations', 'users', 'cache', 'jobs'];
                try {
                    $pdo = new PDO(
                        sprintf(
                            'pgsql:host=%s;port=%s;dbname=%s',
                            getenv('DB_HOST') ?: 'localhost',
                            getenv('DB_PORT') ?: '5432',
                            getenv('DB_DATABASE')
                        ),
                        getenv('DB_USERNAME'),
                        getenv('DB_PASSWORD'),
                        [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION, PDO::ATTR_TIMEOUT => 5]
                    );
                    if ($mode === 'needs-seed') {
                        exit(((int) $pdo->query('select count(*) from users')->fetchColumn()) === 0 ? 0 : 1);
                    }
                    $names = "'" . implode("','", $core) . "'";
                    $found = (int) $pdo->query(
                        "select count(*) from information_schema.tables"
                        . " where table_schema = 'public' and table_name in ($names)"
                    )->fetchColumn();
                    if ($found === count($core)) {
                        exit(0);
                    }
                    fwrite(STDERR, sprintf("[db-guard] only %d/%d core tables present\n", $found, count($core)));
                    exit(1);
                } catch (Throwable $e) {
                    fwrite(STDERR, '[db-guard] database not usable: ' . $e->getMessage() . "\n");
                    exit($mode === 'needs-seed' ? 1 : 2);
                }
                PHPGUARD

                cat > "$SRC/db-guard.sh" <<'SHGUARD'
                #!/bin/bash
                # Generated by kdai-infra/azure-pipelines.yml - do not edit in the app repo.
                # Watchdog for the volume-less postgres in Container Apps: a platform replica move can
                # leave the live database empty (the entrypoint migrated the replica that was going away),
                # and nothing re-migrates it. Check the schema, and rebuild it when it is gone.
                INTERVAL="${DB_GUARD_INTERVAL:-20}"
                STRIKES="${DB_GUARD_STRIKES:-3}"   # consecutive empty-schema checks before acting
                misses=0
                echo "[db-guard] watching ${DB_HOST:-?}/${DB_DATABASE:-?} every ${INTERVAL}s"
                while true; do
                    sleep "$INTERVAL"
                    php /app/db-guard.php check
                    rc=$?
                    # 0 = healthy, 2 = unreachable (replica moving - nothing to migrate against yet)
                    if [ "$rc" -ne 1 ]; then
                        misses=0
                        continue
                    fi
                    misses=$((misses + 1))
                    if [ "$misses" -lt "$STRIKES" ]; then
                        continue
                    fi
                    echo "[db-guard] schema missing on ${DB_HOST} for $((misses * INTERVAL))s - re-running migrations"
                    if php /app/artisan migrate --force --no-interaction; then
                        if php /app/db-guard.php needs-seed; then
                            php /app/artisan db:seed --force --no-interaction || echo "[db-guard] seeding failed"
                        fi
                        php /app/artisan config:clear >/dev/null 2>&1 || true
                        echo "[db-guard] database restored"
                    else
                        echo "[db-guard] migrate failed - retrying in ${INTERVAL}s"
                    fi
                    misses=0
                done
                SHGUARD
                chmod +x "$SRC/db-guard.sh"

                # Run the watchdog next to the other long-lived processes. Only the backend
                # app runs supervisord; the reverb image overrides ENTRYPOINT/CMD, so it does
                # not get a second guard.
                SUPERVISORD="$SRC/supervisord.conf"
                [ -f "$SUPERVISORD" ] || { echo "##[error]supervisord.conf not found; db-guard would never run"; exit 1; }
                if ! grep -q '^\[program:db-guard\]' "$SUPERVISORD"; then
                  # upstream's last line has no trailing newline (same trap as php-fpm.conf)
                  if [ -n "$(tail -c1 "$SUPERVISORD")" ]; then printf '\n' >> "$SUPERVISORD"; fi
                  cat >> "$SUPERVISORD" <<'SUPGUARD'

                [program:db-guard]
                command=/bin/bash /app/db-guard.sh
                autostart=true
                autorestart=true
                redirect_stderr=true
                stdout_logfile=/dev/stdout
                stdout_logfile_maxbytes=0
                priority=2
                startsecs=0
                SUPGUARD
                fi

                # BUILD HOTFIX: the CCoE pool's unauthenticated GitHub codeload path is
                # rate-limited, which breaks composer dist downloads. Composer reads a
                # project-level auth.json from the working dir, so copy one in right
                # before `composer install` and strip it from the final layer.
                # (Intermediate layers in the private ACR still contain it — acceptable
                # for inno-d, the token is the pipeline's own.)
                if [ -n "$GITHUB_TOKEN" ] && [ "${GITHUB_TOKEN#\$(}" = "$GITHUB_TOKEN" ]; then
                  printf '{"github-oauth": {"github.com": "%s"}}\n' "$GITHUB_TOKEN" > "$SRC/auth.json"
                  sed -i 's#^RUN composer install#COPY auth.json ./auth.json\nRUN composer install#' "$SRC/Dockerfile"
                  printf '\nRUN rm -f /app/auth.json\n' >> "$SRC/Dockerfile"
                fi

                ACR_LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
                [ -n "$ACR_LOGIN_SERVER" ] || { echo "##[error]No ACR found in $RESOURCE_GROUP"; exit 1; }
                az acr login --name "${ACR_LOGIN_SERVER%%.*}"

                docker build \
                  -t "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:$IMAGE_TAG" \
                  -t "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:latest" \
                  "$SRC"

                # The db-guard watchdog is only useful if it parses: a syntax error would
                # just exit non-zero forever and the database would silently never be
                # repaired. Lint inside the image we just built (the agent has no PHP).
                docker run --rm --entrypoint php                   "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:$IMAGE_TAG" -l /app/db-guard.php

                docker push "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:$IMAGE_TAG"
                docker push "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:latest"

                # Reverb variant: same code, but runs only the websocket server.
                # A derived image (instead of a Container Apps command override) because
                # the az CLI cannot pass command args that start with "--", and because
                # this must skip docker-entrypoint.sh (no second migrate/seed race).
                cat > /tmp/Dockerfile.reverb <<EOF
                FROM $ACR_LOGIN_SERVER/$BACKEND_IMAGE:$IMAGE_TAG
                ENTRYPOINT []
                CMD ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081", "--debug"]
                EOF
                docker build -f /tmp/Dockerfile.reverb \
                  -t "$ACR_LOGIN_SERVER/$REVERB_IMAGE:$IMAGE_TAG" \
                  -t "$ACR_LOGIN_SERVER/$REVERB_IMAGE:latest" \
                  "$SRC"
                docker push "$ACR_LOGIN_SERVER/$REVERB_IMAGE:$IMAGE_TAG"
                docker push "$ACR_LOGIN_SERVER/$REVERB_IMAGE:latest"

          - task: AzureCLI@2
            displayName: Build and push frontend
            env:
              IMAGE_TAG: $(Build.BuildId)
              FRONTEND_IMAGE: $(FRONTEND_IMAGE)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              REVERB_APP_ID: $(REVERB_APP_ID)
              REVERB_APP_KEY: $(REVERB_APP_KEY)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                SRC="$(Build.SourcesDirectory)/kdai3/frontend"
                [ -d "$SRC" ] || { echo "##[error]kdai3/frontend not found in checkout"; exit 1; }

                # PIPELINE PATCH (app repo is read-only): raise the client-side emulation
                # upload cap from 100MB to 2GB so the browser doesn't reject the file
                # before it reaches the backend. Only AUDIO_FILE_CONFIG (100MB) is touched
                # — the 10MB DEBATE_FILE_CONFIG is left alone — plus the two "100MB" hints
                # shown in the EmulationTab UI.
                FILEVAL="$SRC/src/utils/fileValidation.ts"
                if [ -f "$FILEVAL" ]; then
                  sed -i 's#maxSizeBytes: 100 \* 1024 \* 1024, // 100MB#maxSizeBytes: 2048 * 1024 * 1024, // 2GB#' "$FILEVAL"
                else
                  echo "##[warning]fileValidation.ts not found; skipped client upload-size patch"
                fi
                EMUTAB="$SRC/src/components/debate/EmulationTab.vue"
                if [ -f "$EMUTAB" ]; then
                  sed -i 's/maximale bestandsgrootte van 100MB/maximale bestandsgrootte van 2GB/' "$EMUTAB"
                  sed -i 's/Maximaal 100MB\./Maximaal 2GB./' "$EMUTAB"
                else
                  echo "##[warning]EmulationTab.vue not found; skipped upload-size text patch"
                fi

                for v in REVERB_APP_ID REVERB_APP_KEY; do
                  case "${!v}" in
                    ""|'$('*) echo "##[error]$v is not set in the kdai-secrets variable group"; exit 1 ;;
                  esac
                done

                ACR_LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
                az acr login --name "${ACR_LOGIN_SERVER%%.*}"

                # Everything is same-origin behind the nginx front door:
                #  - VITE_API_BASE_URL=/api        → axios uses relative URLs
                #  - VITE_REVERB_HOST=localhost    → echoService falls back to
                #    location.hostname, so websockets go to wss://<nginx-fqdn>:443/app
                docker build \
                  --build-arg VITE_API_BASE_URL=/api \
                  --build-arg VITE_REVERB_APP_KEY="$REVERB_APP_KEY" \
                  --build-arg VITE_REVERB_APP_ID="$REVERB_APP_ID" \
                  --build-arg VITE_REVERB_HOST=localhost \
                  --build-arg VITE_REVERB_PORT=443 \
                  --build-arg VITE_REVERB_SCHEME=https \
                  --build-arg VITE_WS_PATH=/app \
                  -t "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:$IMAGE_TAG" \
                  -t "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:latest" \
                  "$SRC"
                docker push "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:$IMAGE_TAG"
                docker push "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:latest"

          - task: AzureCLI@2
            displayName: Build and push nginx, CSP, whisperlive shim, emulator, minio-init
            env:
              IMAGE_TAG: $(Build.BuildId)
              NGINX_IMAGE: $(NGINX_IMAGE)
              CSP_IMAGE: $(CSP_IMAGE)
              WHISPERLIVE_IMAGE: $(WHISPERLIVE_IMAGE)
              M3U8_IMAGE: $(M3U8_IMAGE)
              MINIO_INIT_IMAGE: $(MINIO_INIT_IMAGE)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                KDAI3="$(Build.SourcesDirectory)/kdai3"
                OVERRIDE_ROOT=$(find "$(Build.SourcesDirectory)" -maxdepth 4 -type d -name pipeline-overrides | head -1)
                [ -n "$OVERRIDE_ROOT" ] || { echo "##[error]pipeline-overrides dir not found under sources"; exit 1; }

                ACR_LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
                az acr login --name "${ACR_LOGIN_SERVER%%.*}"

                build_push() { # $1=image name, remaining args passed to docker build
                  local image="$1"; shift
                  docker build -t "$ACR_LOGIN_SERVER/$image:$IMAGE_TAG" -t "$ACR_LOGIN_SERVER/$image:latest" "$@"
                  docker push "$ACR_LOGIN_SERVER/$image:$IMAGE_TAG"
                  docker push "$ACR_LOGIN_SERVER/$image:latest"
                }

                # nginx front door (infra-owned; envsubst-templated upstreams)
                build_push "$NGINX_IMAGE" "$OVERRIDE_ROOT/nginx"

                # ATTS-CSP straight from the kdai3 repo — no patches needed:
                # MINIO_SECURE is env-driven and the redis worker reconnects itself.
                build_push "$CSP_IMAGE" "$KDAI3/services/ATTS-CSP"

                # WhisperLive-protocol shim backed by Azure AI Speech (replaces the
                # GPU-only ghcr.io/collabora/whisperlive-gpu image, CPU-only env).
                build_push "$WHISPERLIVE_IMAGE" "$OVERRIDE_ROOT/whisperlive-shim"

                # M3U8 emulator (test stream)
                build_push "$M3U8_IMAGE" "$KDAI3/services/M3U8-emulator"

                # MinIO init job (bucket + per-service users/policies).
                # Normalize CRLF on the agent — the mc image has no sed (ubi-micro),
                # and a CRLF script is the known kdai3 Windows-checkout failure mode.
                sed -i 's/\r$//' "$KDAI3/_storage/minio_setup/init_minio.sh"
                build_push "$MINIO_INIT_IMAGE" -f "$OVERRIDE_ROOT/minio-init/Dockerfile" "$KDAI3/_storage/minio_setup"

  - stage: Deploy
    displayName: Deploy to Container Apps
    dependsOn: Build
    jobs:
      - job: Deploy
        displayName: Deploy all services
        steps:
          - checkout: none

          - task: AzureCLI@2
            displayName: Deploy postgres
            env:
              POSTGRES_APP: $(POSTGRES_APP)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              CONTAINER_APP_ENV: $(CONTAINER_APP_ENV)
              POSTGRES_USER: $(POSTGRES_USER)
              POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)
              POSTGRES_DB: $(POSTGRES_DB)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                for v in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB; do
                  case "${!v}" in
                    ""|'$('*) echo "##[error]$v is not set in the kdai-secrets variable group"; exit 1 ;;
                  esac
                done

                if az containerapp show --name "$POSTGRES_APP" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
                  az containerapp secret set \
                    --name "$POSTGRES_APP" --resource-group "$RESOURCE_GROUP" \
                    --secrets "postgres-user=${POSTGRES_USER}" "postgres-password=${POSTGRES_PASSWORD}"
                  az containerapp update \
                    --name "$POSTGRES_APP" --resource-group "$RESOURCE_GROUP" \
                    --image "docker.io/library/postgres:18.0" \
                    --set-env-vars \
                      "POSTGRES_USER=secretref:postgres-user" \
                      "POSTGRES_PASSWORD=secretref:postgres-password" \
                      "POSTGRES_DB=${POSTGRES_DB}"
                else
                  az containerapp create \
                    --name "$POSTGRES_APP" --resource-group "$RESOURCE_GROUP" \
                    --environment "$CONTAINER_APP_ENV" \
                    --image "docker.io/library/postgres:18.0" \
                    --ingress internal --transport tcp --target-port 5432 --exposed-port 5432 \
                    --secrets "postgres-user=${POSTGRES_USER}" "postgres-password=${POSTGRES_PASSWORD}" \
                    --env-vars \
                      "POSTGRES_USER=secretref:postgres-user" \
                      "POSTGRES_PASSWORD=secretref:postgres-password" \
                      "POSTGRES_DB=${POSTGRES_DB}" \
                    --cpu 0.5 --memory 1.0Gi \
                    --min-replicas 1 --max-replicas 1
                fi

          - task: AzureCLI@2
            displayName: Deploy minio
            env:
              MINIO_APP: $(MINIO_APP)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              CONTAINER_APP_ENV: $(CONTAINER_APP_ENV)
              MINIO_ROOT_USER: $(MINIO_ROOT_USER)
              MINIO_ROOT_PASSWORD: $(MINIO_ROOT_PASSWORD)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                for v in MINIO_ROOT_USER MINIO_ROOT_PASSWORD; do
                  case "${!v}" in
                    ""|'$('*) echo "##[error]$v is not set in the kdai-secrets variable group"; exit 1 ;;
                  esac
                done
                MINIO_IMG="quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z"

