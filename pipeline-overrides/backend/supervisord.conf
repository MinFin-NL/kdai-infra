[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:migrate-and-seed]
# PIPELINE OVERRIDE: `config:cache` is run first so the framework reads the runtime
# Container App env vars (DB_*, MINIO_*, REVERB_*) and bakes them into the config cache.
# Without this, `php artisan serve` (PHP's built-in web server) does NOT expose container
# env vars to Laravel's env(), so config falls back to defaults (e.g. DB_CONNECTION=sqlite).
# Running config:cache via the CLI (which DOES read the env) fixes every config()-based value
# for the long-running web/queue/reverb processes that read the cache.
command=sh -c "php /app/artisan config:cache && php /app/artisan migrate --force && php /app/artisan db:seed --force"
autostart=true
autorestart=false
startsecs=0
exitcodes=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=1

[program:reverb]
command=php /app/artisan reverb:start
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=2
startsecs=0

[program:queue]
command=php /app/artisan queue:work
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=3
startsecs=0

[program:serve]
# PIPELINE OVERRIDE: run PHP's built-in server DIRECTLY instead of via `php artisan serve`.
# `artisan serve` spawns the web server as a subprocess with a curated $passthroughVariables
# allow-list, which DROPS the Container App env vars (ATTS_HEALTH_URL, START/STOP_TRANSCRIPTION_URL,
# TCS_URL, STREAM_*) that the transcription service reads via getenv() at request time -> the ATTS
# health check curls an empty URL -> toggle returns 503. Running php -S directly under supervisord
# inherits the full environment, so getenv() works in the request handler. (This is the exact
# command `artisan serve` runs internally; serve.sh falls back to artisan serve if the server.php
# router is ever missing, so this can never take the API offline.)
command=sh /app/serve.sh
environment=PHP_CLI_SERVER_WORKERS=4
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=4
startsecs=0
